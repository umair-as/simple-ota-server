services:
  nginx:
    image: nginx:alpine
    ports:
      - "8443:8443"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      # Only what nginx needs - never expose ca.key or device keys to a network-facing container
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key:ro
      - ./data:/data:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    expose:
      - "8081"
    environment:
      - DATA_DIR=/data
      - SERVER_URL=${SERVER_URL:?set SERVER_URL in .env, e.g. https://<vps-ip>:8443}
      - DEFAULT_COMPATIBLE=${DEFAULT_COMPATIBLE:-default}
      - COMPATIBLE=${COMPATIBLE:-default}
    volumes:
      - ./data:/data
      - ./static:/app/static:ro
      - ./boards.json:/app/boards.json:ro
    restart: unless-stopped
