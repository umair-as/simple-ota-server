services:
  nginx:
    # Pinned to a stable release + digest so upgrades are deliberate. 1.30.7 fixes the
    # 2026-11-18 HTTP/2 advisories (CVE-2026-123007, CVE-2026-123633). To bump: pick the
    # new stable tag, `skopeo inspect docker://docker.io/library/nginx:<tag>` for the digest.
    image: nginx:1.30.7-alpine@sha256:bef154735288bc38d99fac41ae63730684bcc661503673a04a0f9bc526ba8598
    ports:
      - "8443:8443"
      - "127.0.0.1:8080:8080"
    # `z` relabels bind mounts for SELinux hosts (Fedora/RHEL, podman); ignored elsewhere.
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro,z
      # Only what nginx needs - never expose ca.key or device keys to a network-facing container
      - ./certs/ca.crt:/certs/ca.crt:ro,z
      - ./certs/server.crt:/certs/server.crt:ro,z
      - ./certs/server.key:/certs/server.key:ro,z
      - ./data:/data:ro,z
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    expose:
      - "8081"
    environment:
      - DATA_DIR=/data
      - SERVER_URL=${SERVER_URL:?set SERVER_URL in .env, e.g. https://<vps-ip>:8443}
      - DEFAULT_COMPATIBLE=${DEFAULT_COMPATIBLE:-default}
      - COMPATIBLE=${COMPATIBLE:-default}
    volumes:
      - ./data:/data:z
      - ./static:/app/static:ro,z
      - ./boards.json:/app/boards.json:ro,z
    restart: unless-stopped
